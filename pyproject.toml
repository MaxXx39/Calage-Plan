[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calage-plans"
version = "0.1.0"
description = "Calage et nettoyage automatiques de plans DWG/DXF en MN95 (apprendre puis rejouer)"
requires-python = ">=3.11"
dependencies = ["ezdxf>=1.3", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
calage = "calage.cli:main"

[tool.setuptools]
packages = ["calage", "calage_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
